<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA | Sign In</title>

    <link
        rel="stylesheet"
        href="sign in.css"
    >

</head>

<body>

    <main class="auth-page">


        <a
            href="index.html"
            class="auth-logo"
        >
            NOVA
        </a>


        <section class="auth-card">

            <div class="auth-heading">

                <p class="eyebrow">
                    WELCOME BACK
                </p>


                <h1>
                    Sign In
                </h1>


                <p>
                    Sign in to continue to your NOVA account.
                </p>

            </div>


            <form
                class="signin-form"
                id="signin-form"
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <div class="label-row">

                        <label for="password">
                            Password
                        </label>


                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <label class="remember-row">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <button
                    type="submit"
                    class="signin-button"
                >
                    Sign In
                </button>


                <p
                    class="form-message"
                    id="form-message"
                ></p>

            </form>


            <div class="divider">

                <span>
                    OR
                </span>

            </div>


            <p class="create-account">
                Don't have a NOVA account?
                <a href="#">
                    Create one
                </a>
            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to NOVA
            </a>

        </section>


        <p class="copyright">
            © 2026 NOVA. All rights reserved.
        </p>

    </main>


    <script src="sign-in.js"></script>

</body>

</html>
