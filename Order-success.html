<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA | Order Confirmed</title><link rel="stylesheet" href="Checkout.css"><style>.success-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:#050506}.success-box{max-width:650px;text-align:center;padding:55px;background:#101014;border:1px solid #292931;border-radius:18px}.tick{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#440080;font-size:34px}.success-box h1{font-size:42px}.success-box p{color:#aaa}.order-meta{margin:28px 0;padding:18px;border:1px solid #292931;border-radius:10px}.success-box a{display:inline-block;padding:13px 20px;background:#440080;color:#fff;text-decoration:none;border-radius:8px}</style></head><body><main class="success-page"><section class="success-box"><div class="tick">✓</div><p>NOVA ORDER CONFIRMED</p><h1>Thank you for your order.</h1><p>Your simulated checkout is complete. No real payment was processed.</p><div class="order-meta" id="order-meta"></div><a href="Products.html">Continue Shopping</a></section></main><script>try{const o=JSON.parse(localStorage.getItem('novaLastOrder'));document.getElementById('order-meta').innerHTML=o?'<strong>'+o.orderNumber+'</strong><br>Total: ₦'+Number(o.total||0).toLocaleString('en-NG'):'Order details unavailable.'}catch(e){document.getElementById('order-meta').textContent='Order details unavailable.'}</script></body></html>
